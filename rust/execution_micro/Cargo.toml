[package]
name = "execution-micro"
version = "0.1.0"
edition = "2021"
description = "Fast-path micro-decision library for execution (tick/lot quantization, cancel/replace decisions)"

[dependencies]
rust_decimal = "1.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"

